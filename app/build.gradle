plugins {
    id 'com.android.application'
}

android {
    namespace 'com.g2signage.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.g2signage.player"
        minSdk 21
        targetSdk 34
        versionCode 10003
        versionName "1.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Nenhuma dependência externa — usa apenas o WebView nativo do Android
}