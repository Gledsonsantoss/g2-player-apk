<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .icon {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            background: linear-gradient(135deg, #6366f1, #4338ca);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
        }
        h1 { color: #fff; font-size: 30px; font-weight: 700; letter-spacing: 0.02em; }
    </style>
</head>
<body>
    <div class="icon">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2"></rect>
            <polyline points="17 2 12 7 7 2"></polyline>
        </svg>
    </div>
    <h1>G2 Digital Signage</h1>
    <script>
        // Reconecta em silêncio — sem telas de erro ou avisos de conexão.
        setTimeout(function () { window.location.replace('https://g2-screen-flow.base44.app/player'); }, 15000);
    </script>
</body>
</html>
